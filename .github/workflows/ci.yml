name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Build browser-session SDK
        run: npm --workspace packages/browser-session run build

      - name: Typecheck CLI
        run: npm --workspace apps/cli run typecheck

      - name: Typecheck vault API
        run: npm --workspace apps/web run typecheck

      - name: Test CLI and browser-session SDK
        run: |
          npm --workspace apps/cli test
          npm --workspace packages/browser-session test

      - name: Test browser-session experiments
        run: node --test experiments/chatgpt-session-http/*.test.mjs

      - name: Build vault API
        run: npm run web:build

      - name: Test Worker
        run: npm --workspace apps/web test

      - name: Build CLI
        run: npm --workspace apps/cli run build

  ios:
    name: Native iOS unit and UI tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec apps/ios/project.yml
      - name: Select available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          echo "IOS_TEST_DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Test native app
        run: xcodebuild -project apps/ios/Sickrat.xcodeproj -scheme Sickrat -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/Sickrat.xcresult" test
      - name: Upload native test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/Sickrat.xcresult
          if-no-files-found: ignore
          retention-days: 7
